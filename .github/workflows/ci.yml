name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/backend

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Create backend virtual environment and install Python deps
        run: |
          python -m venv backend/venv
          backend/venv/bin/python -m pip install --upgrade pip
          backend/venv/bin/python -m pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Start backend API
        run: |
          nohup venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/ikano_backend.log 2>&1 &
          sleep 10
        working-directory: backend

      - name: Run backend tests
        run: venv/bin/python -m pytest -q
        working-directory: backend

      - name: Check backend is responding
        run: curl --retry 20 --retry-delay 1 --retry-connrefused http://localhost:8000/

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run frontend tests
        run: npx playwright test --workers 1 --retries=0 --reporter=line
        working-directory: frontend
